name: 风格化着色(Blender NPR)
description: 风格化着色专用 Agent（基于 cordis）：具备标准模式的全部能力与运行时检查工具，并预装 stylized-shading 技能，用于指导 AI 正确使用"风格化着色工具"插件的 NPR 材质节点组（多功能风格化shader/主节点/轮廓光/高光/反射/脏迹/AO/Z轴变化/渐变/光源拓展BSDF等），并把用户的自然语言需求（卡通/赛璐璐/描边/水彩/手绘/做旧/金属/灯光分层/排线/网点/调色/体积雾光等）翻译为本插件节点组的参数实现；插件内置创意效果模块（排线纹理/网点纹理/整体HSL/对比度/物体随机化/体积雾/体积光，原创设计补齐能力缺口），AI 可发散思维新建节点组（借鉴 Stylized Asset Suite 参数逻辑，参考手册 sas_reference.md）。
